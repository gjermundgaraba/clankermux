name: release
# On v* tags: builds the Linux binaries and attaches them to the tag's GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: jdx/mise-action@v2
      - run: cargo build --release --locked -p clankermux --target ${{ matrix.target }}
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          asset=clankermux-${GITHUB_REF_NAME#v}-$TARGET
          cp "target/$TARGET/release/clankermux" "$asset"
          strip "$asset"
          # Both jobs try to create the release; the second one finds it there.
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
