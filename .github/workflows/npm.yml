name: npm
# Release: bump the version, commit, tag v<version> and push the tag. Publishes every package whose
# version npm doesn't have yet, through npm trusted publishing. A new package's first version is
# published by hand (`pnpm publish`), then `npm trust github <package> --repo <repo> --file npm.yml`.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: just wasm
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          pnpm -r publish --no-git-checks
